# Leave memory available for the Android emulator and Docker Desktop.
org.gradle.jvmargs=-XX:ActiveProcessorCount=2 -Xms64m -Xmx768m -XX:+UseSerialGC -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false


kotlin.compiler.execution.strategy=in-process
# Avoid plugin incremental-cache close failures on this Windows setup.
kotlin.incremental=false

