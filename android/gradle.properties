# Leave memory available for the Android emulator and Docker Desktop.
org.gradle.jvmargs=-XX:ActiveProcessorCount=2 -Xms64m -Xmx768m -XX:+UseSerialGC -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false


kotlin.compiler.execution.strategy=in-process

